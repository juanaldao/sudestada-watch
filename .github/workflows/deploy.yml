name: deploy sudestada schema

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sudestada-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # Creates the database if needed and applies schema/views. The ETL itself is the
      # scheduled MotherDuck Flight `sudestada-hourly`, registered by deploy/sync_flights.py.
      - name: Apply schema
        run: python deploy/init_db.py
