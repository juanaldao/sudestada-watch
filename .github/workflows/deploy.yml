name: deploy sudestada flights

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sudestada-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install duckdb

      # Applies schema/views AND registers/updates the four Flights (each pip-installs this
      # repo at the pushed commit and runs on its own cron inside MotherDuck).
      - name: Sync Flights
        run: python deploy/sync_flights.py
