# Public site. The ETL itself (ingest + alerts) is ONE scheduled MotherDuck Flight,
# `sudestada-hourly` at :03 UTC (deploy/sync_flights.py); this workflow only republishes the
# GitHub Pages snapshot of the Dives and checks that the Flight is still running.
#
# Why :10: the Flight runs at :03 and takes well under a minute, so the snapshot includes that
# hour's data. INA and SHN both publish at :45, so hourly is the data's real resolution.
#
# The real clock is EXTERNAL: cron-job.org POSTs workflow_dispatch at :10 every hour (see
# README "Hourly trigger"). In practice GitHub fired `schedule` only 4-6 times a day, at random
# minutes; API dispatches start within seconds. The schedule below stays as a fallback; a
# double run only republishes the same snapshot, and the concurrency group stops overlaps.
#
# Staleness check: a Flight that stops running fails silently on the MotherDuck side, so the
# last step fails this run (and GitHub emails) when no observation was ingested in 2 h.
name: run sudestada jobs

on:
  schedule:
    - cron: "10 * * * *"   # fallback only; cron-job.org's dispatch is the primary trigger
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: site
        options:
          - site          # republish the public GitHub Pages site
          - notify_test   # send one test message to prove the alert channel works

permissions:
  contents: read

# Don't let a slow run stack up on the next tick, but never cancel one mid-deploy.
concurrency:
  group: sudestada-run
  cancel-in-progress: false

jobs:
  notify_test:
    if: ${{ inputs.job == 'notify_test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Send test notification
        run: |
          python -c "from lib.notify import get_notifier; import sys; ok = get_notifier().send('\u2705 sudestada watch: test notification. If you can read this, the alert channel works.'); print('delivered:', ok); sys.exit(0 if ok else 1)"

  # Public read-only site on GitHub Pages: the Dives in dives/ bundled with a snapshot of their
  # query results (site/export_data.py), so friends can see it without a MotherDuck account.
  # Scheduled ticks and `site` dispatches run it; a notify_test dispatch skips it.
  site:
    if: ${{ inputs.job == '' || inputs.job == 'site' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Snapshot Dive queries
        run: python site/export_data.py

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # Runs after the deploy so a stale site still publishes, then the run fails and GitHub
      # emails. ingested_at (not ts_utc) measures whether the Flight runs: normal age here is
      # ~7 min, so 2 h means about two missed Flight runs.
      - name: Check the Flight is still ingesting
        run: |
          python -c "
          import sys
          from lib.md import connect, utcnow
          last = connect().execute('SELECT max(ingested_at) FROM observation').fetchone()[0]
          age = utcnow().replace(tzinfo=None) - last
          print(f'newest ingestion {last} UTC, {age} ago')
          sys.exit(f'STALE: nothing ingested for {age}; is the sudestada-hourly Flight running?' if age.total_seconds() > 2 * 3600 else 0)
          "
