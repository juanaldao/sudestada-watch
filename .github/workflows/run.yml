# Scheduled ETL. MotherDuck Flights would be the natural home for this (see PLAN.md), but
# scheduled Flights require a Business plan, so the cron lives here instead. Each job just
# calls the same flights/<module>.main() the Flights would have run.
#
# GitHub's scheduled runs are queued and can be late or skipped under load. That is tolerable
# here: ingestion is idempotent (natural PKs + ON CONFLICT) and alerts dedupe via alert_event,
# so a missed tick is picked up by the next one.
name: run sudestada jobs

on:
  schedule:
    - cron: "*/15 * * * *"        # ingest_levels
    - cron: "0 * * * *"           # ingest_wind
    - cron: "5 * * * *"           # ingest_forecasts
    - cron: "7,22,37,52 * * * *"  # eval_alerts
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options:
          - all
          - ingest_levels
          - ingest_wind
          - ingest_forecasts
          - eval_alerts
          - notify_test   # send one test message to prove the alert channel works

permissions:
  contents: read

# Don't let a slow run stack up on the next tick, but never cancel one mid-write.
concurrency:
  group: sudestada-run-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Map the cron that fired (github.event.schedule) to the module it belongs to.
      - name: Select modules
        id: sel
        run: |
          case "${{ github.event.schedule }}" in
            "*/15 * * * *")       mods=ingest_levels ;;
            "0 * * * *")          mods=ingest_wind ;;
            "5 * * * *")          mods=ingest_forecasts ;;
            "7,22,37,52 * * * *") mods=eval_alerts ;;
            *)                    mods="${{ inputs.job }}" ;;
          esac
          if [ "$mods" = "all" ] || [ -z "$mods" ]; then
            mods="ingest_levels ingest_wind ingest_forecasts eval_alerts"
          fi
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "running: $mods"

      - name: Run
        run: |
          for m in ${{ steps.sel.outputs.mods }}; do
            echo "::group::$m"
            if [ "$m" = "notify_test" ]; then
              python -c "from lib.notify import get_notifier; import sys; ok = get_notifier().send('\u2705 sudestada watch: test notification. If you can read this, the alert channel works.'); print('delivered:', ok); sys.exit(0 if ok else 1)"
            else
              python -c "from flights import $m; $m.main()"
            fi
            echo "::endgroup::"
          done
