# Scheduled ETL. MotherDuck Flights would be the natural home for this (see PLAN.md), but
# scheduled Flights require a Business plan, so the cron lives here instead.
#
# HOURLY at :03, one schedule entry, all four modules in dependency order.
#
# Why hourly: INA and SHN both publish on the hour at :45 -- every level reading in the table
# sits at minute 45, without exception. A 15-minute poll re-fetched identical rows four times
# and gained nothing; the sources, not the cron, set the real resolution.
#
# Why :03: eighteen minutes after publication, so a tick reads fresh data with ample margin for
# a source that posts late. (Originally :52, picked to dodge GitHub's contended top of the hour;
# that no longer matters since the real trigger is the external dispatch below.)
#
# Why one entry: each cron line is a separate registration and GitHub deprioritises
# high-frequency schedules -- with 7,22,37,52 only 1 tick in 4 ran. One hourly registration
# asks for the least and is the most likely to be honoured.
#
# Running all four per tick means eval_alerts always reads data ingested seconds earlier.
# Late or dropped ticks stay harmless: ingestion is idempotent (natural PKs + ON CONFLICT,
# verified in production -- a repeat run touched 17 rows, not 743, with zero duplicate keys)
# and alerts dedupe via alert_event.
#
# The real clock is EXTERNAL: cron-job.org POSTs workflow_dispatch at :03 every hour (see
# README "Hourly trigger"). Even one hourly entry was not honoured -- in practice GitHub fired
# `schedule` only 4-6 times a day, at random minutes. API dispatches start within seconds.
# The schedule below stays as a fallback; a double run is harmless for the reasons above, and
# the concurrency group stops two runs overlapping.
name: run sudestada jobs

on:
  schedule:
    - cron: "3 * * * *"    # fallback only; cron-job.org's dispatch is the primary trigger
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options:
          - all
          - ingest_levels
          - ingest_wind
          - ingest_forecasts
          - eval_alerts
          - notify_test   # send one test message to prove the alert channel works
          - site          # only republish the public GitHub Pages site

permissions:
  contents: read

# Don't let a slow run stack up on the next tick, but never cancel one mid-write.
concurrency:
  group: sudestada-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Scheduled ticks run everything; a manual dispatch can pick one job.
      - name: Select modules
        id: sel
        run: |
          mods="${{ inputs.job }}"
          if [ "$mods" = "all" ] || [ -z "$mods" ]; then
            mods="ingest_levels ingest_wind ingest_forecasts eval_alerts"
          fi
          if [ "$mods" = "site" ]; then mods=""; fi   # handled by the site job below
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "running: $mods"

      - name: Run
        run: |
          for m in ${{ steps.sel.outputs.mods }}; do
            echo "::group::$m"
            if [ "$m" = "notify_test" ]; then
              python -c "from lib.notify import get_notifier; import sys; ok = get_notifier().send('\u2705 sudestada watch: test notification. If you can read this, the alert channel works.'); print('delivered:', ok); sys.exit(0 if ok else 1)"
            else
              python -c "from flights import $m; $m.main()"
            fi
            echo "::endgroup::"
          done

  # Public read-only site on GitHub Pages: the Dives in dives/ bundled with a snapshot of their
  # query results (site/export_data.py), so friends can see it without a MotherDuck account.
  # Runs after ingestion so the snapshot includes this tick's data, and even when an ingest step
  # failed: stale-but-published beats nothing. A single-module dispatch skips it.
  site:
    needs: run
    if: ${{ !cancelled() && (inputs.job == '' || inputs.job == 'all' || inputs.job == 'site') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Snapshot Dive queries
        run: python site/export_data.py

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
