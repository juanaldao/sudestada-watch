# Scheduled ETL. MotherDuck Flights would be the natural home for this (see PLAN.md), but
# scheduled Flights require a Business plan, so the cron lives here instead.
#
# ONE schedule entry, deliberately. Four separate entries on :00/:05 boundaries produced zero
# runs in 67 minutes on 2026-08-30 -- each entry is its own registration, and GitHub drops
# scheduled runs under load, worst at the top of the hour. A single off-boundary cron is one
# registration at a quieter minute. Every tick runs all four modules in dependency order, so
# eval_alerts always sees data ingested moments earlier (the old split gave no such guarantee).
#
# Running everything every 15 min costs ~96 fetches/day per source instead of 24 for
# wind/forecasts -- negligible for these APIs, and worth it for the simpler, sturdier trigger.
# Late or dropped ticks stay harmless: ingestion is idempotent (natural PKs + ON CONFLICT) and
# alerts dedupe via alert_event.
name: run sudestada jobs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # all four modules, off-boundary
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options:
          - all
          - ingest_levels
          - ingest_wind
          - ingest_forecasts
          - eval_alerts
          - notify_test   # send one test message to prove the alert channel works

permissions:
  contents: read

# Don't let a slow run stack up on the next tick, but never cancel one mid-write.
concurrency:
  group: sudestada-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Scheduled ticks run everything; a manual dispatch can pick one job.
      - name: Select modules
        id: sel
        run: |
          mods="${{ inputs.job }}"
          if [ "$mods" = "all" ] || [ -z "$mods" ]; then
            mods="ingest_levels ingest_wind ingest_forecasts eval_alerts"
          fi
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "running: $mods"

      - name: Run
        run: |
          for m in ${{ steps.sel.outputs.mods }}; do
            echo "::group::$m"
            if [ "$m" = "notify_test" ]; then
              python -c "from lib.notify import get_notifier; import sys; ok = get_notifier().send('\u2705 sudestada watch: test notification. If you can read this, the alert channel works.'); print('delivered:', ok); sys.exit(0 if ok else 1)"
            else
              python -c "from flights import $m; $m.main()"
            fi
            echo "::endgroup::"
          done
